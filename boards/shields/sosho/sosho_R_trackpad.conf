CONFIG_ZMK_KEYBOARD_NAME="sosho"

#BLE connect
CONFIG_ZMK_BLE=y
#Mac との接続間隔（単位 1.25 ms）。11.25〜15 ms を要求する。
#Apple の規定（QA1931）は下限 15 ms 以上が原則で、HID なら 11.25 ms まで受け付けることがある。
#15 ms 固定（12 / 12）は 30 ms に広げられることがあるので避ける。
#ZMK の既定（7.5〜15 ms）は規定に合わず、Mac で全部の入力が遅れて見えた（2026-10-12。USB では遅れない）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
#送信出力を +8 dBm（nRF52840 の最大）にする。Mac 側の受信の取りこぼしによる再送を減らし、送れる量を保つ
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#SPI
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
#Glidepoint
CONFIG_INPUT_PINNACLE=y

#encoder sensitive
#CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128

#RGBLED_WIDGET
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

#充電状態の表示（充電中 = 黄の点滅、完了 = 緑の点灯。src/charging_led.c）
CONFIG_SOSHO_CHARGING_LED=y

#BATTERY
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_BAS=y

#SPLIT
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_USB_LOGGING=n
